<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Egg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1a1a26" />
      <stop offset="60%" stop-color="#0a0a10" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <radialGradient id="shell" cx="38%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="38%" stop-color="#fbf3df" />
      <stop offset="78%" stop-color="#e9d8b4" />
      <stop offset="100%" stop-color="#b89a6c" />
    </radialGradient>
    <radialGradient id="hi" cx="34%" cy="24%" r="38%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
    <radialGradient id="orbA" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="rgba(255,138,91,0.45)" />
      <stop offset="100%" stop-color="rgba(255,138,91,0)" />
    </radialGradient>
    <radialGradient id="orbB" cx="85%" cy="100%" r="70%">
      <stop offset="0%" stop-color="rgba(255,209,102,0.3)" />
      <stop offset="100%" stop-color="rgba(255,209,102,0)" />
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feOffset dx="0" dy="18" result="off" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" ry="112" fill="url(#orbA)" />
  <rect width="512" height="512" rx="112" ry="112" fill="url(#orbB)" />

  <g filter="url(#drop)">
    <path
      d="M256 96
         C 350 96 386 218 386 308
         C 386 400 332 442 256 442
         C 180 442 126 400 126 308
         C 126 218 162 96 256 96 Z"
      fill="url(#shell)"
    />
    <path
      d="M256 96
         C 350 96 386 218 386 308
         C 386 400 332 442 256 442
         C 180 442 126 400 126 308
         C 126 218 162 96 256 96 Z"
      fill="url(#hi)"
    />
