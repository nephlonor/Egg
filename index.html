<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Egg</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Egg" />
    <meta name="application-name" content="Egg" />
    <link rel="preload" as="image" href="./images/level-1.jpg" />
    <link rel="preload" as="image" href="./images/level-2.jpg" />
    <link rel="preload" as="image" href="./images/level-3.jpg" />
    <link rel="preload" as="image" href="./images/level-4.jpg" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="grain"></div>
    </div>

    <main class="stage" id="stage" data-level="0">
      <div class="egg-view" aria-hidden="true">
        <img class="lvl l0" src="./images/level-0.jpg" alt="" draggable="false" decoding="async" />
        <img class="lvl l1" src="./images/level-1.jpg" alt="" draggable="false" decoding="async" />
        <img class="lvl l2" src="./images/level-2.jpg" alt="" draggable="false" decoding="async" />
        <img class="lvl l3" src="./images/level-3.jpg" alt="" draggable="false" decoding="async" />
        <img class="lvl l4" src="./images/level-4.jpg" alt="" draggable="false" decoding="async" />
      </div>

      <div class="hint" id="hint" role="status" aria-live="polite">
        <span>tap to enable motion</span>
      </div>
    </main>

    <script>
      try {
        var v = localStorage.getItem("egg.level.v1");
        if (v !== null) {
          var n = parseInt(v, 10);
          if (n >= 0 && n <= 4) {
            document.getElementById("stage").dataset.level = String(n);
          }
        }
      } catch (e) {}
    </script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
